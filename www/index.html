    <link rel="canonical" href="https://icrowleyshr.github.io/mao-tse-norton/">

    <!-- Ícone -->
    <link rel="icon" type="image/png" href="./img/norton.png">

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FH5M8MEER8"></script>

        function gtag() { dataLayer.push(arguments); }

        gtag('config', 'G-FH5M8MEER8');

</head>


<body>

    <!-- Tela inicial -->
    <div id="telaInicial">

        <h1>MAO TSE NORTON</h1>

        <p>Player de Música</p>

        <div class="play-icon">
            ▶
        </div>

        <div class="radio-info">
            Clique para começar
        </div>

    </div>


    <!-- Player -->
    <div id="player" class="hidden">

        <!-- Imagem -->
        <div class="img-wrapper">

            <img src="./img/norton.png" alt="Mao Tse Norton">

        </div>


        <!-- Controles -->
        <div class="player-controls">

            <!-- Informações -->
            <div class="music-info">

                <div class="music-title" id="musicTitle">
                    Nenhuma música selecionada
                </div>

                <div class="music-source" id="musicSource">
                    📻 Rádio / Arquivo local
                </div>

            </div>


            <!-- Botões -->
            <div class="controls-buttons">

                <button id="btnPrev" title="Anterior">
                    ⏮
                </button>

                <button id="btnPlayPause" title="Play/Pause">
                    ▶
                </button>

                <button id="btnNext" title="Próxima">
                    ⏭
                </button>

                <button id="btnStop" title="Parar">
                    ⏹
                </button>

            </div>


            <!-- Progresso -->
            <div class="progress-container">

                <span class="time-current" id="timeCurrent">
                    0:00
                </span>

                <input type="range" id="progressBar" min="0" max="100" value="0">

                <span class="time-total" id="timeTotal">
                    0:00
                </span>

            </div>


            <!-- Volume -->
            <div class="volume-container">

                <span class="volume-icon">
                    🔊
                </span>

                <input type="range" id="volumeControl" min="0" max="100" value="80">

            </div>


            <!-- Playlist -->
            <div class="playlist-container">

                <button id="btnTogglePlaylist" class="toggle-playlist">
                    📋 Playlist
                </button>


                <div id="playlist" class="playlist hidden">

                    <div class="playlist-header">

                        <span>
                            🎵 Playlist
                        </span>

                        <button id="btnAddMusic" class="btn-add" style="display:none;">
                            + Adicionar
                        </button>

                        <button id="btnClearPlaylist" class="btn-clear" style="display:none;">
                            🗑 Limpar
                        </button>

                    </div>


                    <ul id="playlistItems"></ul>


                    <div class="playlist-footer">

                        <button id="btnLoadPreset1" class="preset-btn">
                            🎵 Clássicas
                        </button>

                        <button id="btnLoadPreset2" class="preset-btn">
                            📻 Rádio
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- Status -->
        <div id="audioStatus">
            📻 Pronto para tocar
        </div>

    </div>


    <!-- Player de áudio -->
    <audio id="musica" preload="auto"></audio>


    <!-- Upload -->
    <input type="file" id="fileInput" accept=".mp3,.aac,.wav,.ogg" multiple style="display:none;">


    <script src="script.js"></script>

</body>

</html>
